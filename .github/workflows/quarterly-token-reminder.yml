
name: Quarterly IBM Token Reminder
on:
  schedule:
    - cron: "0 15 1 1,4,7,10 *"
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Rotate IBM_QUANTUM_TOKEN (Quarterly)"
          content-filepath: .github/ISSUE_TEMPLATES/rotate_token.md
          labels: security, maintenance
