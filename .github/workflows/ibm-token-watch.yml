
name: IBM Token Watch (Weekly)
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install qiskit-ibm-runtime==0.25.0
      - name: Verify token
        env:
          IBM_QUANTUM_TOKEN: ${{ secrets.IBM_QUANTUM_TOKEN || secrets.IBM_QUANTUM_API_TOKEN }}
          IBM_QUANTUM_INSTANCE: ${{ secrets.IBM_QUANTUM_INSTANCE }}
        run: |
          python ops/verify_ibm_token.py > verify.json
          echo "RESULT<<EOF" >> $GITHUB_OUTPUT
          cat verify.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Open issue if failed
        run: |
          if ! jq -e '.ok == true' verify.json >/dev/null 2>&1; then
            echo "Opening issue..."
            echo "The IBM token health check failed. See logs for details." > /tmp/msg.md
            gh issue create -t "IBM token check failed — action required" -F /tmp/msg.md -l security,bug || true
          fi
